services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./spool:/spool
  streamvault:
    image: node:22-alpine
    working_dir: /app
    network_mode: host
    restart: unless-stopped
    command: node src/server.js
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      DB_PATH: /data/streamvault.db
      REC_PUBKEY: /data/streamvault.pub   # только ПУБЛИЧНЫЙ ключ; приватный — на флешке
      REC_SPOOL: /spool
      REC_DIR: /data/recordings
    volumes:
      - ..:/app:ro
      - ./data:/data
      - ./spool:/spool
