# MediaMTX: принимает RTMP/SRT от Android, отдаёт HLS только на localhost (наружу — через StreamVault)
logLevel: info
readTimeout: 60s
writeTimeout: 60s

authMethod: http
authHTTPAddress: http://127.0.0.1:3000/internal/mediamtx/auth

api: no
metrics: no
pprof: no
playback: no
rtsp: no
webrtc: no

rtmp: yes
rtmpAddress: :1935
# rtmpEncryption: strict   # включите и укажите rtmpServerCert/rtmpServerKey для RTMPS

srt: yes
srtAddress: :8890

hls: yes
hlsAddress: 127.0.0.1:8888
hlsAlwaysRemux: no
hlsVariant: mpegts
hlsSegmentDuration: 2s
hlsSegmentCount: 6

pathDefaults:
  source: publisher
  # запись в spool (открытый текст живёт <~5 мин), StreamVault шифрует и удаляет — см. REC_PUBKEY
  record: yes
  recordPath: /spool/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordSegmentDuration: 10m
# пути вида live/<имя>; проверка ключа — в authHTTPAddress
paths:
  "~^live/[a-z0-9_-]+$": {}
